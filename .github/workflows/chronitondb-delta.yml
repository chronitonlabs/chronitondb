# The delta register check (docs/delta/README.md, Keeping it current): a
# pull request that changes a stock file adds or updates its delta entry,
# and every entry it adds or changes is checked against the template, with
# its index row. Stock files are those outside the paths of Where things
# live in docs/process/conventions.md. The checker, the template and that
# table come from the base branch, never from the pull request, so a pull
# request cannot weaken its own check. The pull request's files are only
# read as data. Before the checker is on the line it says so and passes. It
# reruns when the description changes, since a line "No delta entry:
# <reason>" there lets a stock change pass without an entry, and it reads
# the description from the API when it runs. The checker's unit tests run
# in the doclint-tests job of chronitondb-documents.yml. Every action is
# pinned to a commit.
name: ChronitonDB delta register

on:
  pull_request:
    branches:
      - 'chronitondb-*'
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  delta-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The checker from the base branch
        id: checker
        env:
          BASE: ${{ github.base_ref }}
        run: |
          dir="$RUNNER_TEMP/doclint"
          mkdir -p "$dir"
          for file in doclint.py markdown.py
          do
            if ! git show "origin/$BASE:tools/chronitondb/$file" > "$dir/$file" 2>/dev/null
            then
              echo "tools/chronitondb/$file is not on $BASE yet, so there is no checker to run. The check starts once it is merged."
              echo "present=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if ! grep -q '^    doclint.py delta ' "$dir/doclint.py"
          then
            echo "The checker on $BASE has no delta command yet. The check starts once it is merged."
            echo "present=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=yes" >> "$GITHUB_OUTPUT"

      - name: Delta register
        if: steps.checker.outputs.present == 'yes'
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The description as it is now, not as the event that started
          # this run saw it.
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.txt"
          rc=0
          out="$(python3 "$RUNNER_TEMP/doclint/doclint.py" delta --repo . --base "origin/$BASE" --source HEAD --branch "$BRANCH" --body "$RUNNER_TEMP/body.txt")" || rc=1
          # Bug-ChronitonDB issues are checked by the documents check.
          printf '%s\n' "$out" | grep -v '^issue ' || true
          exit "$rc"
