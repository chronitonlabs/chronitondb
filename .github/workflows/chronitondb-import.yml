# The import history check (docs/process/upstream.md, The import history
# check), with tools/chronitondb/importlint.py: a pull request from an
# import/ branch of this repository brings Apache Cassandra's own history,
# or one commit taken unchanged, and nothing else of Apache Cassandra's
# files. Other checks pass an import by its branch name, so this check
# holds what such a branch may bring. The checker fetches Apache
# Cassandra's tag or branches from the public repository apache/cassandra
# by its address when it runs. A tag or a branch this repository holds is
# no proof. A conflict resolved by hand is reported and refused until a
# maintainer approves the pull request, and the check passes when it is
# run again after that review. The checker, the table that tells the
# project's own files from Apache Cassandra's and the list of maintainers
# come from the base branch, never from the pull request. The pull
# request's commits are only read as data. Before the checker is on the
# line it says so and passes. The author of a pull request from a fork
# chooses its branch name, so only a branch of this repository is held to
# the check, and no other check takes a fork's branch for an import. The
# description and the reviews are read from the API when the job runs. A
# separate job runs the checker's unit tests from the pull request. Every
# action is pinned to a commit.
name: Import history

on:
  pull_request:
    branches:
      - 'chronitondb-*'
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  import-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The checker from the base branch
        id: checker
        env:
          BASE: ${{ github.base_ref }}
        run: |
          dir="$RUNNER_TEMP/importlint"
          mkdir -p "$dir"
          for file in importlint.py doclint.py markdown.py
          do
            if ! git show "origin/$BASE:tools/chronitondb/$file" > "$dir/$file" 2>/dev/null
            then
              echo "tools/chronitondb/$file is not on $BASE yet, so there is no checker to run. The check starts once it is merged."
              echo "present=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "present=yes" >> "$GITHUB_OUTPUT"

      - name: Import history
        if: steps.checker.outputs.present == 'yes'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The branch name counts only for a branch of this repository. A
          # fork's branch has any name its author likes.
          BRANCH=""
          if [ "$HEAD_REPO" = "$REPO" ]
          then
            BRANCH="$HEAD_REF"
          fi
          case "$BRANCH" in
            import/*) ;;
            *)
              echo "This pull request is not from an import branch of this repository, so no check takes it for an import and it is not held to an import's history."
              exit 0
              ;;
          esac
          # The description and the reviews as they are now.
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.txt"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
          python3 "$RUNNER_TEMP/importlint/importlint.py" history --repo . --base "origin/$BASE" --head "$HEAD_SHA" --branch "$BRANCH" --body "$RUNNER_TEMP/body.txt" --reviews "$RUNNER_TEMP/reviews.json"

  importlint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests of the checker
        run: python3 -m unittest discover -s tools/chronitondb/test/importlint -v
