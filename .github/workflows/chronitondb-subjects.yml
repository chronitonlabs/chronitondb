# Commit subjects, checked with tools/chronitondb/subjectlint.py against
# docs/process/conventions.md, Commit messages. The repository makes the
# pull request title the subject of its squash or merge commit, so the
# title is checked on every pull request. The footer of a breaking change
# is read from the pull request's commit messages, which the squash commit
# carries, and a footer only in the description is refused. The title and
# the description are read from the API when the job runs, so an edit is
# checked as it is now. A title of type import, which is held to neither
# the length rule nor the file rule, is taken only from an import/ branch of
# this repository. The author of a pull request from a fork chooses its
# branch name, so a fork's branch never counts.
# The checker and the rules come from the base branch, never from the pull
# request. Before the checker is on the line it says so and passes. A
# separate job runs the checker's unit tests from the pull request. On a
# push to a line, a third job checks the subject of each new commit on the
# line, which catches a subject edited in the merge dialog. It fails the
# run on that commit, and GitHub notifies the person who merged. Every
# action is pinned to a commit.
name: ChronitonDB subjects

on:
  pull_request:
    branches:
      - 'chronitondb-*'
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - 'chronitondb-*'

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The checker from the base branch
        id: checker
        env:
          BASE: ${{ github.base_ref }}
        run: |
          dir="$RUNNER_TEMP/subjectlint"
          mkdir -p "$dir"
          if ! git show "origin/$BASE:tools/chronitondb/subjectlint.py" > "$dir/subjectlint.py" 2>/dev/null
          then
            echo "tools/chronitondb/subjectlint.py is not on $BASE yet, so there is no checker to run. The check starts once it is merged."
            echo "present=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=yes" >> "$GITHUB_OUTPUT"

      - name: Pull request title
        if: steps.checker.outputs.present == 'yes'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The title and description as they are now, not as the event
          # that started this run saw them.
          title="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .title)"
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.txt"
          echo "Title: $title"
          # The head branch, for the import type, once the checker on the
          # line takes it. The name counts only for a branch of this
          # repository. A fork's branch has any name its author likes.
          branch=()
          if grep -q -- '--branch NAME' "$RUNNER_TEMP/subjectlint/subjectlint.py"
          then
            name=""
            if [ "$HEAD_REPO" = "$REPO" ]
            then
              name="$HEAD_REF"
            fi
            branch=(--branch "$name")
          fi
          python3 "$RUNNER_TEMP/subjectlint/subjectlint.py" title --repo . --rules "origin/$BASE" --commits "origin/$BASE..HEAD" --body "$RUNNER_TEMP/body.txt" "${branch[@]}" "$title"

  subjectlint-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests of the checker
        run: python3 -m unittest discover -s tools/chronitondb/test/subjectlint -v

  line-subjects:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Subjects of the new commits on the line
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ ! -f tools/chronitondb/subjectlint.py ]
          then
            echo "tools/chronitondb/subjectlint.py is not on this line yet, so there is no checker to run."
            exit 0
          fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null
          then
            echo "The line is new here, so no commit is new on it."
            exit 0
          fi
          python3 tools/chronitondb/subjectlint.py commits --repo . --rules "$AFTER" "$BEFORE..$AFTER"
