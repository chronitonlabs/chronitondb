# The review verdict check (docs/process/branching-and-review.md, The
# review record), with tools/chronitondb/reviewlint.py: the newest review
# of the project's review App is a clean verdict, and it names the commit
# the pull request is at now. A review of the App with no verdict block
# fails: the App posts nothing but verdicts, so an older verdict never
# counts in its place. A clean verdict says the pull request is ready,
# every checklist it ran passed, and no blocker and no major finding is
# open. A verdict with such a finding open fails the job until a later
# verdict on the head is clean. The job reads no waiver: the reviewer
# records a waiver in a new verdict. The job only reads: it starts no
# review and asks for none. A review by the project's review roles runs
# on a pull request the project's automation wrote, and on one a
# maintainer accepted for review with the label triage:accepted, so a
# verdict is due on those and on no other. The automation is told by the
# id of the pull request's author. Of the events of the label only those
# of a maintainer of docs/governance/committers.md count, and the newest
# of them decides. Any other pull request passes with the line "no review
# verdict is due". The reviewer's verdict is posted by the review App. The
# job proves that the App's user posted it, on the head commit, and that
# nobody edited it since. It cannot prove who asked the App to post it:
# that the App's key is kept from the accounts that write pull requests is
# a matter of where the project runs its roles, not of GitHub. The
# checker, the file that names the App and the automation,
# tools/chronitondb/review-app.json, and the list of maintainers come from
# the base branch, never from the pull request. The pull request, its
# events, its reviews and their edits are read from the API when the job
# runs, and nothing of the pull request is run. A review of any other
# account counts for nothing, and so does a verdict that was edited after
# it was posted. Before the checker is on the line the job says so and
# passes. Once it is, a missing file that names the App or the
# maintainers fails the job as a file that cannot be read. While the file
# that names the App holds its placeholders the job fails, with a message
# that says which file to fill. The job runs again when a review is
# posted, edited or dismissed, so a verdict posted after the last push is
# seen, and when a label is set or taken off. A separate job runs the
# checker's unit tests from the pull request, on every event this
# workflow runs on, so it is never skipped on the head a review run
# reads. Every action is pinned to a commit.
name: Review verdict

on:
  pull_request:
    branches:
      - 'chronitondb-*'
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-verdict:
    if: startsWith(github.event.pull_request.base.ref, 'chronitondb-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The checker from the base branch
        id: checker
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          dir="$RUNNER_TEMP/reviewlint"
          mkdir -p "$dir"
          for file in tools/chronitondb/reviewlint.py tools/chronitondb/markdown.py
          do
            if ! git show "origin/$BASE:$file" > "$dir/${file##*/}" 2>/dev/null
            then
              echo "$file is not on $BASE yet, so there is no checker to run. The check starts once it is merged."
              echo "present=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Once the checker is on the line, a file it reads that the line
          # lacks is left empty, and the checker fails on it.
          for file in tools/chronitondb/review-app.json docs/governance/committers.md
          do
            git show "origin/$BASE:$file" > "$dir/${file##*/}" 2>/dev/null || : > "$dir/${file##*/}"
          done
          echo "present=yes" >> "$GITHUB_OUTPUT"

      - name: Review verdict
        if: steps.checker.outputs.present == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          dir="$RUNNER_TEMP/reviewlint"
          # The pull request, its events, its reviews and their edits as they are now,
          # not as the event that started this run saw them. An answer
          # that cannot be read is left empty, and an empty answer fails.
          gh api "repos/$REPO/pulls/$NUMBER" > "$dir/pull.json" || : > "$dir/pull.json"
          gh api --paginate "repos/$REPO/issues/$NUMBER/events?per_page=100" > "$dir/events.json" || : > "$dir/events.json"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" > "$dir/reviews.json" || : > "$dir/reviews.json"
          gh api graphql -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F number="$NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviews(last: 100) {
                    nodes { fullDatabaseId lastEditedAt editor { login } }
                  }
                }
              }
            }' > "$dir/edits.json" || : > "$dir/edits.json"
          python3 "$dir/reviewlint.py" verdict --app "$dir/review-app.json" --maintainers "$dir/committers.md" --pull "$dir/pull.json" --events "$dir/events.json" --reviews "$dir/reviews.json" --edits "$dir/edits.json"

  reviewlint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests of the checker
        run: python3 -m unittest discover -s tools/chronitondb/test/reviewlint -v
