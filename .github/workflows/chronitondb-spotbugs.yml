# SpotBugs with FindSecBugs on the compiled org/chronitondb classes. Report
# only: findings are printed and never fail the check, a missed planted bug
# in the self-test does. The jars are pinned by sha256 in
# tools/chronitondb/spotbugs-check.sh. The script and its pins come from the
# base branch, in a tree of their own, never from the pull request, and its
# self-test runs before anything of the pull request does. The build that
# follows is the pull request's own, since its classes are what is
# analysed, so this job reports and is never a gate on a finding. The JDK
# is the one the build file of the base branch names as its default: 17 on
# the 5.0 line, 21 on the 6.0 line. The build runs only when the pull
# request has org/chronitondb sources. Before the script is on the line the
# job says so and passes. A separate job runs the self-test of the script
# the pull request brings, when it changes tools/chronitondb. Every action
# is pinned to a commit.
name: ChronitonDB SpotBugs

on:
  pull_request:
    branches:
      - 'chronitondb-*'

permissions:
  contents: read

jobs:
  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: The check from the base branch
        id: line
        env:
          BASE: ${{ github.base_ref }}
        run: |
          line="$RUNNER_TEMP/line"
          git worktree add --detach "$line" "origin/$BASE" > /dev/null
          if [ ! -f "$line/tools/chronitondb/spotbugs-check.sh" ] || ! grep -q -- '--tree DIR' "$line/tools/chronitondb/spotbugs-check.sh"
          then
            echo "The SpotBugs check on $BASE cannot read the classes of another tree yet, so there is no check to run. The check starts once it is merged."
            echo "present=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          java="$(sed -n -E 's/^[[:space:]]*<property name="java\.default" value="([0-9]+)"[[:space:]]*\/>.*$/\1/p' "$line/build.xml" | head -n 1)"
          if [ -z "$java" ]
          then
            echo "::error::build.xml on $BASE names no java.default, so the JDK of the line cannot be read."
            exit 1
          fi
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "present=yes" >> "$GITHUB_OUTPUT"

      - name: The JDK of the line
        if: steps.line.outputs.present == 'yes'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.line.outputs.java }}

      - name: Self-test SpotBugs and FindSecBugs with the script of the line
        if: steps.line.outputs.present == 'yes'
        run: |
          "$RUNNER_TEMP/line/tools/chronitondb/spotbugs-check.sh" --self-test

      # On 6.0 this also builds the modules/accord submodule.
      - name: Build
        if: steps.line.outputs.present == 'yes' && hashFiles('src/java/org/chronitondb/**') != ''
        run: ant jar

      # Same condition as Build: with no org/chronitondb sources there is nothing to analyse and no build to read.
      - name: SpotBugs on the org/chronitondb classes (report only)
        if: steps.line.outputs.present == 'yes' && hashFiles('src/java/org/chronitondb/**') != ''
        run: |
          "$RUNNER_TEMP/line/tools/chronitondb/spotbugs-check.sh" --tree "$GITHUB_WORKSPACE"

  spotbugs-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does the pull request change the check
        id: own
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$(git diff --name-only "origin/$BASE...HEAD" -- tools/chronitondb)" ]
          then
            echo "The pull request changes nothing under tools/chronitondb, so it brings no check to test."
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          java="$(sed -n -E 's/^[[:space:]]*<property name="java\.default" value="([0-9]+)"[[:space:]]*\/>.*$/\1/p' build.xml | head -n 1)"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: The JDK of the line
        if: steps.own.outputs.changed == 'yes'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.own.outputs.java }}

      - name: Self-test the check the pull request brings
        if: steps.own.outputs.changed == 'yes'
        run: tools/chronitondb/spotbugs-check.sh --self-test
